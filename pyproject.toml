[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "streamflow-pulse-client"
version = "2.7.5"
description = "Official Python client for StreamFlow Pulse — AI Agent Platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Njong Michael", email = "mike.njo@gmail.com"},
]
keywords = ["pulse", "streamflow", "ai", "agents", "pipelines", "llm", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# B-114 — duplex needs a WebSocket client. Optional so the core SDK stays
# httpx-only; install with `pip install streamflow-pulse-client[duplex]`.
duplex = [
    "websockets>=12,<16",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "websockets>=12,<16",
]
dev = [
    "streamflow-pulse-client[test]",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/olsisoft/pulse-py"
Documentation = "https://github.com/olsisoft/pulse-py/blob/main/README.md"
Source = "https://github.com/olsisoft/pulse-py/tree/main"
Issues = "https://github.com/olsisoft/pulse-py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=pulse_client --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
