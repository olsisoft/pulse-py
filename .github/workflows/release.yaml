name: Release to PyPI

# Lives at .github/workflows/release.yaml in olsisoft/pulse-py.
# Triggered by tag push (v*). Builds wheel + sdist, publishes via OIDC
# trusted publishing (no PyPI token needed — set up the trusted publisher
# binding in PyPI account settings pointing at this workflow).
#
# Reference: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for OIDC trusted publishing
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi    # configure in repo settings → environments
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(grep -E '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ($tag_version) does not match pyproject.toml version ($pkg_version)"
            exit 1
          fi

      - name: Install build deps
        run: python -m pip install --upgrade pip build twine

      - name: Run tests one last time
        run: |
          pip install -e ".[test]"
          pytest -v

      - name: Build wheel + sdist
        run: python -m build

      - name: Verify distributions
        run: twine check dist/*

      - name: Publish to PyPI (OIDC trusted publishing — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
